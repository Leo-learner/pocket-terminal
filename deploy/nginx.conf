server {
 listen 443 ssl;
 server_name terminal.dkz12345.com;
 ssl_certificate /etc/letsencrypt/live/terminal.dkz12345.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/terminal.dkz12345.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 root /opt/apps/pocket-terminal/current/dist;
 index index.html;
 client_max_body_size 32k;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://terminal.dkz12345.com; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
 gzip on;
 gzip_types application/javascript text/css application/json image/svg+xml;
 location / {
   expires -1;
   try_files $uri $uri/ =404;
 }
 location /api/ {
   access_log off;
   proxy_pass http://127.0.0.1:43210;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_connect_timeout 5s;
   proxy_read_timeout 20s;
   proxy_buffering off;
 }
 location = /ws {
   access_log off;
   proxy_pass http://127.0.0.1:43210;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_read_timeout 90s;
   proxy_send_timeout 90s;
   proxy_buffering off;
 }
}
server {
 listen 80;
 server_name terminal.dkz12345.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://$host$request_uri; }
}
